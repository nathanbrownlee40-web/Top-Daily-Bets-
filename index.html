<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Top Daily Bets"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" sizes="512x512" href="icon-512x512.png"><link rel="apple-touch-icon" sizes="192x192" href="icon-192x192.png">
<title>Top Daily Bets + Tracker</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--nav:#0f172a;--accent:#16a34a;--win:#dcfce7;--winInk:#166534;--loss:#fee2e2;--lossInk:#991b1b;--pending:#fff7ed;--pendingInk:#c2410c;--shadow:0 8px 24px rgba(15,23,42,.07)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:94px}.top{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.97);color:#fff;padding:18px 18px 14px;backdrop-filter:blur(12px)}.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:850;font-size:20px}.subtitle{font-size:12px;color:#cbd5e1;margin-top:3px}.content{padding:14px}.screen{display:none}.screen.active{display:block}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:10px 12px;box-shadow:var(--shadow);min-height:82px}.stat.good{background:var(--win);border-color:#86efac}.stat.bad{background:var(--loss);border-color:#fca5a5}.stat.neutral{background:#fff}.stat b{font-size:21px;display:block;margin-top:3px}.stat.good b{color:var(--winInk)}.stat.bad b{color:var(--lossInk)}.stat span{font-size:11px;color:var(--muted)}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}.sectionHead h2{font-size:17px;margin:0}.btn{border:0;border-radius:13px;padding:10px 13px;font-weight:800}.btn.primary{background:#16a34a;color:#fff}.btn.secondary{background:#e2e8f0;color:#0f172a}.btn.danger{background:#fee2e2;color:#991b1b}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow);margin:9px 0}.bet{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:9px 0;overflow:hidden;box-shadow:var(--shadow)}.bet.win{background:var(--win);border-color:#86efac}.bet.loss{background:var(--loss);border-color:#fca5a5}.bet.pending{background:var(--pending);border-color:#fdba74}.betHead{padding:13px 14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.betId{font-size:17px;font-weight:850}.dateLine{font-size:11px;color:#475569;margin-top:3px;font-weight:650}.match{font-size:15px;font-weight:850;margin-top:7px}.market{font-size:12px;color:var(--muted);margin-top:2px}.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:850;white-space:nowrap}.badge.win{background:#bbf7d0;color:#166534}.badge.loss{background:#fecaca;color:#991b1b}.badge.pending{background:#ffedd5;color:#c2410c;border:1px solid #fdba74}.betMeta{display:flex;gap:10px;flex-wrap:wrap;padding:0 14px 11px;color:#475569;font-size:11px}.betMeta strong{color:#0f172a}.betFoot{border-top:1px solid rgba(148,163,184,.22);padding:10px 14px;display:flex;justify-content:space-between;gap:10px;font-size:11px}.betFoot b{font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.form{display:grid;gap:10px}.field label{display:block;font-size:11px;font-weight:800;color:#475569;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:11px;padding:10px 11px;background:#fff;color:#0f172a}.field textarea{min-height:80px;resize:vertical}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:11px;color:var(--muted);margin-top:10px}.graphCard{background:#0b1220;color:#fff;border-radius:18px;padding:14px;margin-top:9px;box-shadow:var(--shadow)}.graphTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.graphTop b{font-size:16px}.graphTop span{font-size:11px;color:#cbd5e1}.graph{width:100%;height:210px;display:block}.graphLabels{display:flex;justify-content:space-between;font-size:10px;color:#cbd5e1;margin-top:-3px}.legend{display:flex;gap:14px;margin-top:9px;font-size:11px;color:#cbd5e1}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}.green{background:#22c55e}.red{background:#fb7185}.empty{padding:24px;text-align:center;color:var(--muted)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);background:#fff;border-top:1px solid #e2e8f0;display:grid;grid-template-columns:repeat(4,1fr);z-index:30}.nav button{border:0;background:#fff;padding:9px 4px 10px;color:#64748b;font-weight:750}.nav button.active{color:#0f172a}.nav small{display:block;font-size:11px;line-height:1.1;margin-top:3px}.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:9px 12px;border-radius:10px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}.searchRow{display:flex;gap:8px}.searchRow input{flex:1;border:1px solid #cbd5e1;border-radius:11px;padding:10px 11px}.small{font-size:11px;color:var(--muted)}@media(max-width:420px){.formGrid{grid-template-columns:1fr}.stat{min-height:78px}.stat b{font-size:20px}}
</style></head>
<body><div class="app">
<header class="top"><div class="toprow"><div><div class="brand">Top Daily Bets</div><div class="subtitle">Your football bet dashboard</div></div><button class="btn secondary" id="installBtn">📲 Install</button></div></header>
<main class="content"><section id="dashboard" class="screen active"></section><section id="live" class="screen"></section><section id="results" class="screen"></section><section id="stats" class="screen"></section><section id="add" class="screen"></section></main>
<nav class="nav"><button data-screen="dashboard">🏠<small>Dashboard</small></button><button data-screen="live">🔴<small>Live &amp;<br>Upcoming</small></button><button data-screen="results">🎯<small>Bet Results</small></button><button data-screen="stats">📊<small>Bet Stats</small></button></nav></div><div id="toast" class="toast"></div>
<script>
const KEY='topDailyBets.normal.v1';
let state=load()||{bets:[],screen:'dashboard',expanded:''};
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&typeof x==='object'?x:null}catch(e){return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function n(v){const x=parseFloat(v);return Number.isFinite(x)?x:0}
function idNum(b){return parseInt(String(b.id||'').replace(/\D/g,''),10)||0}
function result(b){if(b.result==='Win'||b.result==='Loss')return b.result;if(b.result==='Void')return 'Void';return ''}
function profit(b){const r=result(b);if(r==='Win')return b.actualReturn!=null?n(b.actualReturn)-n(b.stake):n(b.stake)*(n(b.odds)-1);if(r==='Loss')return -n(b.stake);return 0}
function statsFor(bs){const settled=bs.filter(b=>['Win','Loss'].includes(result(b)));const wins=settled.filter(b=>result(b)==='Win').length;const losses=settled.filter(b=>result(b)==='Loss').length;const staked=bs.reduce((a,b)=>a+n(b.stake),0);const odds=bs.filter(b=>n(b.odds)>0);const avg=odds.length?odds.reduce((a,b)=>a+n(b.odds),0)/odds.length:0;const pl=settled.reduce((a,b)=>a+profit(b),0);return {total:bs.length,wins,losses,staked,avg,pl,rate:settled.length?Math.round(wins/settled.length*100):0}}
function sortDesc(a,b){return (String(b.date||'')+' '+String(b.time||'')).localeCompare(String(a.date||'')+' '+String(a.time||''))||idNum(b)-idNum(a)}
function cls(r){return r==='Win'?'win':r==='Loss'?'loss':'pending'}
function money(x){return '£'+n(x).toFixed(2)}
function fmtDate(d,t){if(!d)return '';const dt=new Date((d||'')+'T'+(t||'00:00'));if(Number.isNaN(dt.getTime()))return d+(t?' · '+t:'');return dt.toLocaleDateString(undefined,{day:'2-digit',month:'short'})+(t?' · '+t:'')}
function badge(r){return `<span class="badge ${cls(r)}">${r||'OPEN'}</span>`}
function betCard(b){const r=result(b);const open=!r;const p=profit(b);const title=(b.home&&b.away)?`${b.home} v ${b.away}`:(b.event||'Football bet');return `<article class="bet ${cls(r)}"><div class="betHead"><div><div class="betId">Bet #${idNum(b)||b.id}</div><div class="dateLine">${fmtDate(b.date,b.time)}${b.bookmaker?' · '+b.bookmaker:''}</div><div class="match">${title}</div><div class="market">${b.market||'Selection'} · <strong>${b.selection||'—'}</strong></div></div>${badge(r)}</div><div class="betMeta"><span>Odds <strong>${n(b.odds).toFixed(2)}</strong></span><span>Stake <strong>${money(b.stake)}</strong></span><span>Return <strong>${b.potentialReturn!=null?money(b.potentialReturn):money(n(b.stake)*n(b.odds))}</strong></span></div><div class="betFoot"><span>${b.notes||''}</span><span>${open?'Open':(p>=0?'<b>+'+money(p)+'</b>':'<b>'+money(p)+'</b>')}</span></div></article>`}
function renderDashboard(){const s=statsFor(state.bets), bs=state.bets.slice().sort(sortDesc), open=bs.filter(b=>!result(b)), recent=(open[0]||bs[0]);const tone=s.wins>s.losses?'good':s.losses>s.wins?'bad':'neutral';dashboard.innerHTML=`<div class="stats"><div class="stat"><span>Total Bets</span><b>${s.total}</b></div><div class="stat ${tone}"><span>Win Rate</span><b>${s.rate}%</b></div><div class="stat"><span>Total Staked</span><b>${money(s.staked)}</b></div><div class="stat"><span>Average Odds</span><b>${s.avg?s.avg.toFixed(2):'0.00'}</b></div><div class="stat ${s.pl>0?'good':s.pl<0?'bad':'neutral'}"><span>Profit / Loss</span><b>${s.pl>=0?'+':''}${money(s.pl)}</b></div><div class="stat ${tone}"><span>Wins / Losses</span><b>${s.wins} / ${s.losses}</b></div></div><div class="sectionHead"><h2>${open.length?'Current open bet':'Latest result'}</h2><button class="btn secondary" onclick="show('results')">View all</button></div>${recent?betCard(recent):'<div class="card empty">No bets yet. Add your first normal bet.</div>'}`}
function renderLive(){const bs=state.bets.slice().sort(sortDesc).filter(b=>!result(b));live.innerHTML=`<div class="sectionHead"><h2>Live &amp; Upcoming</h2><button class="btn primary" onclick="show('add')">+ Add Bet</button></div>${bs.length?bs.map(b=>betCard(b)).join(''):'<div class="card empty">No open bets.</div>'}`}
function renderResults(){const bs=state.bets.slice().sort(sortDesc);results.innerHTML=`<div class="sectionHead"><h2>Bet Results</h2><span class="small">${bs.length} total</span></div><div class="searchRow"><input id="search" placeholder="Search team, market or selection"><button class="btn secondary" onclick="renderResults()">Refresh</button></div><div id="resultList" style="margin-top:8px">${bs.length?bs.map(b=>betCard(b)).join(''):'<div class="card empty">No bets recorded yet.</div>'}</div>`;document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();document.getElementById('resultList').innerHTML=bs.filter(b=>JSON.stringify(b).toLowerCase().includes(q)).map(b=>betCard(b)).join('')||'<div class="card empty">No matching bets.</div>'}}
function graph(){const settled=state.bets.filter(b=>result(b)).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));let cum=0;const vals=settled.map(b=>cum+=profit(b));const W=700,H=210,p=25;let pts='';if(vals.length===1)pts=`${p},${H-p-(Math.max(0,vals[0])-Math.min(0,vals[0]))*0}`;const min=Math.min(0,...vals),max=Math.max(0,...vals),range=max-min||1;vals.forEach((v,i)=>{const x=p+(vals.length===1?(W-2*p)/2:i*(W-2*p)/(vals.length-1));const y=H-p-(v-min)/range*(H-2*p);pts+=(i?' ':'')+x+','+y});const zeroY=H-p-(0-min)/range*(H-2*p);return `<svg class="graph" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="${p}" y1="${zeroY}" x2="${W-p}" y2="${zeroY}" stroke="#64748b" stroke-dasharray="4 5"/><line x1="${p}" y1="${p}" x2="${p}" y2="${H-p}" stroke="#334155"/><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="#334155"/>${vals.length?`<polyline fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/>${vals.map((v,i)=>{const x=p+(vals.length===1?(W-2*p)/2:i*(W-2*p)/(vals.length-1));const y=H-p-(v-min)/range*(H-2*p);return `<circle cx="${x}" cy="${y}" r="5" fill="#22c55e"/>`}).join('')}`:''}</svg>`}
function renderStats(){const s=statsFor(state.bets);const tone=s.wins>s.losses?'good':s.losses>s.wins?'bad':'neutral';stats.innerHTML=`<div class="sectionHead"><h2>Bet Stats</h2><span class="small">All time</span></div><div class="stats"><div class="stat"><span>Total Bets</span><b>${s.total}</b></div><div class="stat ${tone}"><span>Win Rate</span><b>${s.rate}%</b></div><div class="stat"><span>Total Staked</span><b>${money(s.staked)}</b></div><div class="stat"><span>Average Odds</span><b>${s.avg?s.avg.toFixed(2):'0.00'}</b></div><div class="stat ${s.pl>0?'good':s.pl<0?'bad':'neutral'}"><span>Profit / Loss</span><b>${s.pl>=0?'+':''}${money(s.pl)}</b></div><div class="stat ${tone}"><span>Wins / Losses</span><b>${s.wins} / ${s.losses}</b></div></div><div class="graphCard"><div class="graphTop"><b>Profit / Loss trend</b><span>Cumulative · Monthly</span></div>${graph()}<div class="graphLabels"><span>£0</span><span>${new Date().toLocaleString(undefined,{month:'short'})}</span></div><div class="legend"><span><i class="dot green"></i>Profit</span><span><i class="dot red"></i>Loss</span></div></div>`}
function renderAdd(){const next=Math.max(0,...state.bets.map(idNum))+1;add.innerHTML=`<div class="sectionHead"><h2>New Bet</h2></div><div class="card"><div class="form"><div class="formGrid"><div class="field"><label>Bet #</label><input id="fId" value="${next}"></div><div class="field"><label>Bookmaker</label><input id="fBook" placeholder="e.g. BET365"></div></div><div class="formGrid"><div class="field"><label>Date</label><input id="fDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Time</label><input id="fTime" type="time"></div></div><div class="formGrid"><div class="field"><label>Home team / event</label><input id="fHome" placeholder="Home team"></div><div class="field"><label>Away team</label><input id="fAway" placeholder="Away team"></div></div><div class="formGrid"><div class="field"><label>Market</label><input id="fMarket" placeholder="Match result, goals, cards..."></div><div class="field"><label>Selection</label><input id="fSelection" placeholder="Your pick"></div></div><div class="formGrid"><div class="field"><label>Odds</label><input id="fOdds" type="number" step="0.01" min="1" placeholder="2.00"></div><div class="field"><label>Stake (£)</label><input id="fStake" type="number" step="0.01" min="0" placeholder="5.00"></div></div><div class="field"><label>Notes</label><textarea id="fNotes" placeholder="Optional notes"></textarea></div><div class="actions"><button class="btn primary" onclick="saveBet()">Save Bet</button></div></div><div class="hint">Normal single bets are stored locally on this device. Your dashboard, results and stats update automatically when you add or settle a bet.</div></div>`}
function saveBet(){const stake=n(fStake.value),odds=n(fOdds.value);if(!fSelection.value.trim()||!odds||!stake){toast('Add a selection, odds and stake');return}state.bets.push({id:'B'+String(fId.value||Math.max(0,...state.bets.map(idNum))+1).padStart(3,'0'),bookmaker:fBook.value.trim(),date:fDate.value,time:fTime.value,home:fHome.value.trim(),away:fAway.value.trim(),market:fMarket.value.trim(),selection:fSelection.value.trim(),odds,stake,potentialReturn:stake*odds,result:'',actualReturn:null,notes:fNotes.value.trim()});save();toast('Bet saved');show('dashboard')}
function settle(id,r){const b=state.bets.find(x=>x.id===id);if(!b)return;b.result=r;if(r==='Win')b.actualReturn=n(b.stake)*n(b.odds);else if(r==='Loss')b.actualReturn=0;save();renderAll()}
function show(name){state.screen=name;document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===name));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.screen===name));if(name==='dashboard')renderDashboard();if(name==='live')renderLive();if(name==='results')renderResults();if(name==='stats')renderStats();if(name==='add')renderAdd()}
function renderAll(){renderDashboard();renderLive();renderResults();renderStats();renderAdd();show(state.screen||'dashboard')}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.screen));
let deferred=null;document.getElementById('installBtn').onclick=()=>{if(deferred){deferred.prompt();deferred=null}else toast('Use your browser menu to install the app')};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
renderAll();
</script></body></html>
