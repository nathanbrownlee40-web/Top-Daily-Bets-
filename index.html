<header class="top"><div class="toprow"><div><div class="brand">Top Daily Bets</div><div class="subtitle">Your football bet dashboard</div></div><button class="btn secondary" id="installBtn">📲 Install</button></div></header>
<main class="content"><section id="dashboard" class="screen active"></section><section id="live" class="screen"></section><section id="results" class="screen"></section><section id="stats" class="screen"></section><section id="add" class="screen"></section></main>

<script>
const KEY='topDailyBets.normal.v1';
let state=load()||{bets:[],screen:'dashboard',expanded:''};
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');const state=x&&typeof x==='object'?x:{bets:[],screen:'dashboard',expanded:''};state.bets=Array.isArray(state.bets)?state.bets:[];state.bets.forEach(b=>{if(typeof b.league!=='string')b.league='';});const seedBase={bookmaker:'',league:'',date:'2026-08-24',time:'18:37',home:'Libertad Asuncion',away:'Sportivo San Lorenzo',market:'1st Half Goals',selection:'Over 0.5',odds:1.61,stake:5,potentialReturn:8.07,result:'',actualReturn:null,notes:'Open bet'};const hasSeed=state.bets.some(b=>(b.home||'')===seedBase.home&&(b.away||'')===seedBase.away&&(b.selection||'')===seedBase.selection&&Number(b.odds)===seedBase.odds&&Number(b.stake)===seedBase.stake);if(!hasSeed){const next=Math.max(0,...state.bets.map(b=>parseInt(String(b.id||'').replace(/\D/g,''),10)||0))+1;state.bets.push({id:'B'+String(next).padStart(3,'0'),...seedBase});localStorage.setItem(KEY,JSON.stringify(state))}return state}catch(e){return {bets:[{id:'B001',bookmaker:'',league:'',date:'2026-08-24',time:'18:37',home:'Libertad Asuncion',away:'Sportivo San Lorenzo',market:'1st Half Goals',selection:'Over 0.5',odds:1.61,stake:5,potentialReturn:8.07,result:'',actualReturn:null,notes:'Open bet'}],screen:'dashboard',expanded:''}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function n(v){const x=parseFloat(v);return Number.isFinite(x)?x:0}
function idNum(b){return parseInt(String(b.id||'').replace(/\D/g,''),10)||0}
function result(b){if(b.result==='Win'||b.result==='Loss')return b.result;if(b.result==='Void')return 'Void';return ''}
function profit(b){const r=result(b);if(r==='Win')return b.actualReturn!=null?n(b.actualReturn)-n(b.stake):n(b.stake)*(n(b.odds)-1);if(r==='Loss')return -n(b.stake);return 0}
function statsFor(bs){const settled=bs.filter(b=>['Win','Loss'].includes(result(b)));const wins=settled.filter(b=>result(b)==='Win').length;const losses=settled.filter(b=>result(b)==='Loss').length;const staked=bs.reduce((a,b)=>a+n(b.stake),0);const odds=bs.filter(b=>n(b.odds)>0);const avg=odds.length?odds.reduce((a,b)=>a+n(b.odds),0)/odds.length:0;const pl=settled.reduce((a,b)=>a+profit(b),0);return {total:bs.length,wins,losses,staked,avg,pl,rate:settled.length?Math.round(wins/settled.length*100):0}}
function sortDesc(a,b){return (String(b.date||'')+' '+String(b.time||'')).localeCompare(String(a.date||'')+' '+String(a.time||''))||idNum(b)-idNum(a)}
function cls(r){return r==='Win'?'win':r==='Loss'?'loss':'pending'}
function money(x){return '£'+n(x).toFixed(2)}
function fmtDate(d,t){if(!d)return '';const dt=new Date((d||'')+'T'+(t||'00:00'));if(Number.isNaN(dt.getTime()))return d+(t?' · '+t:'');return dt.toLocaleDateString(undefined,{day:'2-digit',month:'short'})+(t?' · '+t:'')}
function badge(r){return `<span class="badge ${cls(r)}">${r||'OPEN'}</span>`}
function betCard(b){const r=result(b);const open=!r;const p=profit(b);const title=(b.home&&b.away)?`${b.home} v ${b.away}`:(b.event||'Football bet');return `<article class="bet ${cls(r)}"><div class="betHead"><div><div class="betId">Bet #${idNum(b)||b.id}</div><div class="dateLine">${fmtDate(b.date,b.time)}${b.bookmaker?' · '+b.bookmaker:''}</div><div class="match">${title}</div><div class="market">${b.market||'Selection'} · <strong>${b.selection||'—'}</strong></div></div>${badge(r)}</div><div class="betMeta"><span>Odds <strong>${n(b.odds).toFixed(2)}</strong></span><span>Stake <strong>${money(b.stake)}</strong></span><span>Return <strong>${b.potentialReturn!=null?money(b.potentialReturn):money(n(b.stake)*n(b.odds))}</strong></span></div><div class="betFoot"><span>${b.notes||''}</span><span>${open?'Open':(p>=0?'<b>+'+money(p)+'</b>':'<b>'+money(p)+'</b>')}</span></div>${open?`<div style="padding:0 14px 13px;display:flex;gap:7px"><button class="btn primary" onclick="settle('${b.id}','Win')">✓ Won</button><button class="btn danger" onclick="settle('${b.id}','Loss')">✕ Lost</button></div>`:`<div style="padding:0 14px 13px;display:flex;justify-content:flex-end"><button class="btn secondary" onclick="editResult('${b.id}')">✎ Edit result</button></div>`}</article>`}
function renderDashboard(){const s=statsFor(state.bets), bs=state.bets.slice().sort(sortDesc), open=bs.filter(b=>!result(b)), recent=(open[0]||bs[0]);const tone=s.wins>s.losses?'good':s.losses>s.wins?'bad':'neutral';dashboard.innerHTML=`<div class="stats"><div class="stat"><span>Total Bets</span><b>${s.total}</b></div><div class="stat ${tone}"><span>Win Rate</span><b>${s.rate}%</b></div><div class="stat"><span>Total Staked</span><b>${money(s.staked)}</b></div><div class="stat"><span>Average Odds</span><b>${s.avg?s.avg.toFixed(2):'0.00'}</b></div><div class="stat ${s.pl>0?'good':s.pl<0?'bad':'neutral'}"><span>Profit / Loss</span><b>${s.pl>=0?'+':''}${money(s.pl)}</b></div><div class="stat ${tone}"><span>Wins / Losses</span><b>${s.wins} / ${s.losses}</b></div></div><div class="sectionHead"><h2>${open.length?'Current open bet':'Latest result'}</h2><button class="btn secondary" onclick="show('results')">View all</button></div>${recent?betCard(recent):'<div class="card empty">No bets yet. Add your first normal bet.</div>'}`}
function renderLive(){const bs=state.bets.slice().sort(sortDesc).filter(b=>!result(b));live.innerHTML=`<div class="sectionHead"><h2>Live &amp; Upcoming</h2><button class="btn primary" onclick="show('add')">+ Add Bet</button></div>${bs.length?bs.map(b=>betCard(b)).join(''):'<div class="card empty">No open bets.</div>'}`}
function renderResults(){const bs=state.bets.slice().sort(sortDesc);results.innerHTML=`<div class="sectionHead"><h2>Bet Results</h2><span class="small">${bs.length} total</span></div><div class="searchRow"><input id="search" placeholder="Search team, market or selection"><button class="btn secondary" onclick="renderResults()">Refresh</button></div><div id="resultList" style="margin-top:8px">${bs.length?bs.map(b=>betCard(b)).join(''):'<div class="card empty">No bets recorded yet.</div>'}</div>`;document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();document.getElementById('resultList').innerHTML=bs.filter(b=>JSON.stringify(b).toLowerCase().includes(q)).map(b=>betCard(b)).join('')||'<div class="card empty">No matching bets.</div>'}}
function graph(){const settled=state.bets.filter(b=>result(b)).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));let cum=0;const vals=settled.map(b=>cum+=profit(b));const W=700,H=210,p=25;let pts='';if(vals.length===1)pts=`${p},${H-p-(Math.max(0,vals[0])-Math.min(0,vals[0]))*0}`;const min=Math.min(0,...vals),max=Math.max(0,...vals),range=max-min||1;vals.forEach((v,i)=>{const x=p+(vals.length===1?(W-2*p)/2:i*(W-2*p)/(vals.length-1));const y=H-p-(v-min)/range*(H-2*p);pts+=(i?' ':'')+x+','+y});const zeroY=H-p-(0-min)/range*(H-2*p);return `<svg class="graph" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="${p}" y1="${zeroY}" x2="${W-p}" y2="${zeroY}" stroke="#64748b" stroke-dasharray="4 5"/><line x1="${p}" y1="${p}" x2="${p}" y2="${H-p}" stroke="#334155"/><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="#334155"/>${vals.length?`<polyline fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/>${vals.map((v,i)=>{const x=p+(vals.length===1?(W-2*p)/2:i*(W-2*p)/(vals.length-1));const y=H-p-(v-min)/range*(H-2*p);return `<circle cx="${x}" cy="${y}" r="5" fill="#22c55e"/>`}).join('')}`:''}</svg>`}
function monthKey(b){const s=String(b.date||'');if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return 'undated';return s.slice(0,7)}
function monthLabel(k){if(k==='undated')return 'No date';const [y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})}
function monthlyData(){const groups={};state.bets.forEach(b=>{const k=monthKey(b);if(!groups[k])groups[k]={key:k,label:monthLabel(k),bets:0,wins:0,losses:0,open:0,staked:0,profit:0};const g=groups[k];g.bets++;g.staked+=n(b.stake);const r=result(b);if(r==='Win'){g.wins++;g.profit+=profit(b)}else if(r==='Loss'){g.losses++;g.profit+=profit(b)}else g.open++});return Object.values(groups).sort((a,b)=>b.key.localeCompare(a.key))}
function performanceGroups(field){const groups={};state.bets.filter(b=>result(b)).forEach(b=>{const key=String(b[field]||'').trim();if(!key)return;if(!groups[key])groups[key]={name:key,bets:0,wins:0,losses:0,profit:0,staked:0};const g=groups[key];g.bets++;g.staked+=n(b.stake);const r=result(b);if(r==='Win'){g.wins++;g.profit+=profit(b)}else if(r==='Loss'){g.losses++;g.profit+=profit(b)}});return Object.values(groups).sort((a,b)=>b.profit-a.profit || (b.wins/(b.wins+b.losses||1))-(a.wins/(a.wins+a.losses||1)) || b.bets-a.bets)}
function bestPerformance(field){return performanceGroups(field)[0]||null}
function performanceCard(label,g){if(!g)return `<div class="performanceEmpty">No settled ${label.toLowerCase()} data yet. Add ${label.toLowerCase()} when entering bets.</div>`;const settled=g.wins+g.losses,rate=settled?Math.round(g.wins/settled*100):0;return `<div class="performanceCard"><span class="perfLabel">Best ${label}</span><span class="perfName">${g.name}</span><div class="perfMeta"><span>${g.wins}/${g.losses} · ${rate}% win</span><span class="perfProfit ${g.profit>=0?'pos':'neg'}">${g.profit>=0?'+':''}${money(g.profit)}</span></div></div>`}
function renderStats(){const s=statsFor(state.bets);const tone=s.wins>s.losses?'good':s.losses>s.wins?'bad':'neutral';const months=monthlyData();const settled=s.wins+s.losses;const allProfit=s.pl;const bestLeague=bestPerformance('league'),bestMarket=bestPerformance('market'),bestBookmaker=bestPerformance('bookmaker'),bestSelection=bestPerformance('selection');stats.innerHTML=`<div class="sectionHead"><h2>Bet Stats</h2><span class="small">All time</span></div><div class="stats"><div class="stat"><span>Total Bets</span><b>${s.total}</b></div><div class="stat ${tone}"><span>Win Rate</span><b>${s.rate}%</b></div><div class="stat"><span>Total Staked</span><b>${money(s.staked)}</b></div><div class="stat"><span>Average Odds</span><b>${s.avg?s.avg.toFixed(2):'0.00'}</b></div><div class="stat ${s.pl>0?'good':s.pl<0?'bad':'neutral'}"><span>Profit / Loss</span><b>${s.pl>=0?'+':''}${money(s.pl)}</b></div><div class="stat ${tone}"><span>Wins / Losses</span><b>${s.wins} / ${s.losses}</b></div></div><div class="graphCard"><div class="graphTop"><b>Profit / Loss trend</b><span>Cumulative · Monthly</span></div>${graph()}<div class="graphLabels"><span>£0</span><span>${new Date().toLocaleString(undefined,{month:'short'})}</span></div><div class="legend"><span><i class="dot green"></i>Profit</span><span><i class="dot red"></i>Loss</span></div></div><div class="statsBottom"><div class="statsPanel"><div class="panelHead"><b>Best performing</b><span>Settled bets</span></div><div class="performanceGrid">${performanceCard('League',bestLeague)}${performanceCard('Market',bestMarket)}${performanceCard('Bookmaker',bestBookmaker)}${performanceCard('Selection',bestSelection)}</div><div class="hint" style="color:#8fa3b8;margin-top:10px">Ranked by profit first, then win rate. Open bets are excluded until settled.</div></div><div class="statsPanel"><div class="panelHead"><b>Results</b><span>${s.total} total</span></div><div class="resultGrid"><div class="resultMini win"><span>Wins</span><b>${s.wins}</b></div><div class="resultMini loss"><span>Losses</span><b>${s.losses}</b></div><div class="resultMini open"><span>Open</span><b>${state.bets.filter(b=>!result(b)).length}</b></div></div><div class="resultSummary"><span><i class="summaryDot"></i>${settled===0?'No settled bets yet.':allProfit>=0?`You're <b>in profit by ${money(allProfit)}</b> with a ${s.rate}% win rate.`:`You're <b>down ${money(Math.abs(allProfit))}</b>.`}</span><b>${settled} settled</b></div></div><div class="statsPanel"><div class="panelHead"><b>Monthly performance</b><span>${months.length} month${months.length===1?'':'s'}</span></div>${months.length?`<div class="monthlyList"><div class="monthlyRow head"><span>Month</span><span>Bets</span><span>W/L</span><span>Win Rate</span><span>Profit</span></div>${months.map(m=>{const settledM=m.wins+m.losses,rateM=settledM?Math.round(m.wins/settledM*100):0;return `<div class="monthlyRow ${m.profit>=0?'monthProfit':'monthLoss'}"><span class="month">${m.label}</span><span>${m.bets}</span><span>${m.wins}/${m.losses}</span><span>${rateM}%</span><span class="profit ${m.profit>=0?'pos':'neg'}">${m.profit>=0?'+':''}${money(m.profit)}</span></div>`}).join('')}</div>`:'<div class="monthlyEmpty">No monthly performance yet.</div>'}<div class="performanceLegend"><span><i class="profitDot"></i>Profit</span><span><i class="lossDot"></i>Loss</span></div></div><div class="statsPanel"><div class="panelHead"><b>All-time performance</b><span>All time</span></div><div class="allTimeGrid"><div class="allTimeMini"><span>Bets counted</span><b>${s.total}</b></div><div class="allTimeMini good"><span>Win rate</span><b>${s.rate}%</b></div><div class="allTimeMini good"><span>Wins</span><b>${s.wins}</b></div><div class="allTimeMini bad"><span>Losses</span><b>${s.losses}</b></div><div class="allTimeMini"><span>Open</span><b>${state.bets.filter(b=>!result(b)).length}</b></div><div class="allTimeMini ${s.pl>=0?'good':'bad'}"><span>Profit / Loss</span><b>${s.pl>=0?'+':''}${money(s.pl)}</b></div></div></div></div>`}
function renderAdd(){const next=Math.max(0,...state.bets.map(idNum))+1;add.innerHTML=`<div class="sectionHead"><h2>New Bet</h2></div><div class="card"><div class="form"><div class="formGrid"><div class="field"><label>Bet #</label><input id="fId" value="${next}"></div><div class="field"><label>Bookmaker</label><input id="fBook" placeholder="e.g. BET365"></div></div><div class="formGrid"><div class="field"><label>Date</label><input id="fDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Time</label><input id="fTime" type="time"></div></div><div class="formGrid"><div class="field"><label>Home team / event</label><input id="fHome" placeholder="Home team"></div><div class="field"><label>Away team</label><input id="fAway" placeholder="Away team"></div></div><div class="formGrid"><div class="field"><label>League / competition</label><input id="fLeague" placeholder="e.g. Premier League"></div><div class="field"><label>Market</label><input id="fMarket" placeholder="Match result, goals, cards..."></div><div class="field"><label>Selection</label><input id="fSelection" placeholder="Your pick"></div></div><div class="formGrid"><div class="field"><label>Odds</label><input id="fOdds" type="number" step="0.01" min="1" placeholder="2.00"></div><div class="field"><label>Stake (£)</label><input id="fStake" type="number" step="0.01" min="0" placeholder="5.00"></div></div><div class="field"><label>Notes</label><textarea id="fNotes" placeholder="Optional notes"></textarea></div><div class="actions"><button class="btn primary" onclick="saveBet()">Save Bet</button></div></div><div class="hint">Normal single bets are stored locally on this device. Your dashboard, results and stats update automatically when you add or settle a bet.</div></div>`}
function saveBet(){const stake=n(fStake.value),odds=n(fOdds.value);if(!fSelection.value.trim()||!odds||!stake){toast('Add a selection, odds and stake');return}state.bets.push({id:'B'+String(fId.value||Math.max(0,...state.bets.map(idNum))+1).padStart(3,'0'),bookmaker:fBook.value.trim(),date:fDate.value,time:fTime.value,home:fHome.value.trim(),away:fAway.value.trim(),league:fLeague.value.trim(),market:fMarket.value.trim(),selection:fSelection.value.trim(),odds,stake,potentialReturn:stake*odds,result:'',actualReturn:null,notes:fNotes.value.trim()});save();toast('Bet saved');show('dashboard')}
function settle(id,r){const b=state.bets.find(x=>x.id===id);if(!b)return;b.result=r;if(r==='Win')b.actualReturn=n(b.stake)*n(b.odds);else if(r==='Loss')b.actualReturn=0;else b.actualReturn=null;save();renderAll()}
function editResult(id){const b=state.bets.find(x=>x.id===id);if(!b)return;const current=result(b)||'Open';const choice=prompt(`Change result for Bet #${idNum(b)||b.id}.\n\nType: Open, Win, or Loss`,current);if(choice===null)return;const v=choice.trim().toLowerCase();if(!['open','win','loss'].includes(v)){toast('Please enter Open, Win or Loss');return}settle(id,v==='open'?'':v[0].toUpperCase()+v.slice(1));toast(v==='open'?'Bet reopened':`Result changed to ${v}`)}
function show(name){state.screen=name;document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===name));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.screen===name));if(name==='dashboard')renderDashboard();if(name==='live')renderLive();if(name==='results')renderResults();if(name==='stats')renderStats();if(name==='add')renderAdd()}
function renderAll(){renderDashboard();renderLive();renderResults();renderStats();renderAdd();show(state.screen||'dashboard')}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.screen));
let deferred=null;document.getElementById('installBtn').onclick=()=>{if(deferred){deferred.prompt();deferred=null}else toast('Use your browser menu to install the app')};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
renderAll();
</script></body></html>
