function monthKey(b){const s=String(b.date||'');if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return 'undated';return s.slice(0,7)}

function performanceGroups(field){const groups={};state.bets.filter(b=>result(b)).forEach(b=>{let key;if(field==='marketPick'){const sel=String(b.selection||'').trim();const market=String(b.market||'').trim();key=/^(over|under)\b/i.test(sel)?sel:(market||sel)}else{key=String(b[field]||'').trim()}if(!key)return;if(!groups[key])groups[key]={name:key,bets:0,wins:0,losses:0,profit:0,staked:0};const g=groups[key];g.bets++;g.staked+=n(b.stake);const r=result(b);if(r==='Win'){g.wins++;g.profit+=profit(b)}else if(r==='Loss'){g.losses++;g.profit+=profit(b)}});return Object.values(groups).sort((a,b)=>b.profit-a.profit || (b.wins/(b.wins+b.losses||1))-(a.wins/(a.wins+a.losses||1)) || b.bets-a.bets)}

function performanceBars(label,field){const groups=performanceGroups(field);if(!groups.length)return `<div class="performanceGroup"><div class="perfGroupTitle">${label}</div><div class="performanceEmpty">No settled ${label.toLowerCase()} data yet.</div></div>`;return `<div class="performanceGroup"><div class="perfGroupTitle">${label}</div>${groups.slice(0,5).map(g=>{const settled=g.wins+g.losses,rate=settled?Math.round(g.wins/settled*100):0;const width=Math.max(0,Math.min(100,rate));const tone=performanceTone(rate);return `<div class="perfBarRow"><div class="perfBarHead"><span class="perfName" title="${g.name}">${g.name}</span><b class="perfRate ${tone}">${rate}%</b></div><div class="perfTrack"><div class="perfFill ${tone}" style="width:${width}%"></div></div><div class="perfBarMeta"><span>${g.wins} win${g.wins===1?'':'s'} · ${g.losses} loss${g.losses===1?'':'es'}</span><b class="perfProfit ${tone}">${g.profit>=0?'+':''}${money(g.profit)}</b></div></div>`}).join('')}</div>`}
function renderStats(){const s=statsFor(state.bets);const tone=s.wins>s.losses?'good':s.losses>s.wins?'bad':'neutral';const months=monthlyData();const settled=s.wins+s.losses;const allProfit=s.pl;stats.innerHTML=`<div class="sectionHead"><h2>Bet Stats</h2><span class="small">All time</span></div><div class="stats"><div class="stat"><span>Total Bets</span><b>${s.total}</b></div><div class="stat ${tone}"><span>Win Rate</span><b>${s.rate}%</b></div><div class="stat"><span>Total Staked</span><b>${money(s.staked)}</b></div><div class="stat"><span>Average Odds</span><b>${s.avg?s.avg.toFixed(2):'0.00'}</b></div><div class="stat ${s.pl>0?'good':s.pl<0?'bad':'neutral'}"><span>Profit / Loss</span><b>${s.pl>=0?'+':''}${money(s.pl)}</b></div><div class="stat ${tone}"><span>Wins / Losses</span><b>${s.wins} / ${s.losses}</b></div></div><div class="graphCard"><div class="graphTop"><b>Profit / Loss trend</b><span>Tap a point for details</span></div>${graph()}<div class="graphLabels"><span>£0</span><span>${new Date().toLocaleString(undefined,{month:'short'})}</span></div><div class="legend"><span><i class="dot green"></i>Profit</span><span><i class="dot red"></i>Loss</span></div><div id="graphTip" class="graphTip"></div></div><div class="statsBottom"><div class="statsPanel"><div class="panelHead"><b>Best performing</b><span>Win % by category</span></div><div class="performanceBars">${performanceBars('League','league')}${performanceBars('Market','marketPick')}${performanceBars('Bookmaker','bookmaker')}</div><div class="perfScale"><span><i class="scaleDot vlow"></i>0–39%</span><span><i class="scaleDot low"></i>40–59%</span><span><i class="scaleDot mid"></i>60–69%</span><span><i class="scaleDot good"></i>70–79%</span><span><i class="scaleDot high"></i>80–100%</span></div><div class="hint" style="color:#8fa3b8;margin-top:8px">Bars show win percentage. Red is low and green is high. Ranked by profit first, then win rate. Open bets are excluded until settled.</div></div><div class="statsPanel"><div class="panelHead"><b>Results</b><span>${s.total} total</span></div><div class="resultGrid"><div class="resultMini win"><span>Wins</span><b>${s.wins}</b></div><div class="resultMini loss"><span>Losses</span><b>${s.losses}</b></div><div class="resultMini open"><span>Open</span><b>${state.bets.filter(b=>!result(b)).length}</b></div></div><div class="resultSummary"><span><i class="summaryDot"></i>${settled===0?'No settled bets yet.':allProfit>=0?`You're <b>in profit by ${money(allProfit)}</b> with a ${s.rate}% win rate.`:`You're <b>down ${money(Math.abs(allProfit))}</b>.`}</span><b>${settled} settled</b></div></div><div class="statsPanel"><div class="panelHead"><b>Monthly performance</b><span>${months.length} month${months.length===1?'':'s'}</span></div>${months.length?`<div class="monthlyList"><div class="monthlyRow head"><span>Month</span><span>Bets</span><span>W/L</span><span>Win Rate</span><span>Profit</span></div>${months.map(m=>{const settledM=m.wins+m.losses,rateM=settledM?Math.round(m.wins/settledM*100):0;return `<div class="monthlyRow ${m.profit>=0?'monthProfit':'monthLoss'}"><span class="month">${m.label}</span><span>${m.bets}</span><span>${m.wins}/${m.losses}</span><span>${rateM}%</span><span class="profit ${m.profit>=0?'pos':'neg'}">${m.profit>=0?'+':''}${money(m.profit)}</span></div>`}).join('')}</div>`:'<div class="monthlyEmpty">No monthly performance yet.</div>'}<div class="performanceLegend"><span><i class="profitDot"></i>Profit</span><span><i class="lossDot"></i>Loss</span></div></div><div class="statsPanel"><div class="panelHead"><b>All-time performance</b><span>All time</span></div><div class="allTimeGrid"><div class="allTimeMini"><span>Bets counted</span><b>${s.total}</b></div><div class="allTimeMini good"><span>Win rate</span><b>${s.rate}%</b></div><div class="allTimeMini good"><span>Wins</span><b>${s.wins}</b></div><div class="allTimeMini bad"><span>Losses</span><b>${s.losses}</b></div><div class="allTimeMini"><span>Open</span><b>${state.bets.filter(b=>!result(b)).length}</b></div><div class="allTimeMini ${s.pl>=0?'good':'bad'}"><span>Profit / Loss</span><b>${s.pl>=0?'+':''}${money(s.pl)}</b></div></div></div></div>`}
function renderAdd(){const next=Math.max(0,...state.bets.map(idNum))+1;add.innerHTML=`<div class="sectionHead"><h2>New Bet</h2></div><div class="card"><div class="form"><div class="formGrid"><div class="field"><label>Bet #</label><input id="fId" value="${next}"></div><div class="field"><label>Bookmaker</label><input id="fBook" placeholder="e.g. BET365"></div></div><div class="formGrid"><div class="field"><label>Date</label><input id="fDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Time</label><input id="fTime" type="time"></div></div><div class="formGrid"><div class="field"><label>Home team / event</label><input id="fHome" placeholder="Home team"></div><div class="field"><label>Away team</label><input id="fAway" placeholder="Away team"></div></div><div class="formGrid"><div class="field"><label>League / competition</label><input id="fLeague" placeholder="e.g. Premier League"></div><div class="field"><label>Market</label><input id="fMarket" placeholder="Match result, goals, cards..."></div><div class="field"><label>Selection</label><input id="fSelection" placeholder="Your pick"></div></div><div class="formGrid"><div class="field"><label>Odds</label><input id="fOdds" type="number" step="0.01" min="1" placeholder="2.00"></div><div class="field"><label>Stake (£)</label><input id="fStake" type="number" step="0.01" min="0" placeholder="5.00"></div></div><div class="field"><label>Notes</label><textarea id="fNotes" placeholder="Optional notes"></textarea></div><div class="actions"><button class="btn primary" onclick="saveBet()">Save Bet</button></div></div><div class="hint">Normal single bets are stored locally on this device. Your dashboard, results and stats update automatically when you add or settle a bet.</div></div>`}
function saveBet(){const stake=n(fStake.value),odds=n(fOdds.value);if(!fSelection.value.trim()||!odds||!stake){toast('Add a selection, odds and stake');return}state.bets.push({id:'B'+String(fId.value||Math.max(0,...state.bets.map(idNum))+1).padStart(3,'0'),bookmaker:fBook.value.trim(),date:fDate.value,time:fTime.value,home:fHome.value.trim(),away:fAway.value.trim(),league:fLeague.value.trim(),market:fMarket.value.trim(),selection:fSelection.value.trim(),odds,stake,potentialReturn:stake*odds,result:'',actualReturn:null,notes:fNotes.value.trim()});save();toast('Bet saved');show('dashboard')}
function settle(id,r){const b=state.bets.find(x=>x.id===id);if(!b)return;b.result=r;if(r==='Win')b.actualReturn=n(b.stake)*n(b.odds);else if(r==='Loss')b.actualReturn=0;else b.actualReturn=null;save();renderAll()}
function showGraphPoint(id){const b=state.bets.find(x=>x.id===id);const tip=document.getElementById('graphTip');if(!b||!tip)return;const pft=profit(b);const ordered=state.bets.filter(x=>result(x)).slice().sort((a,b)=>{const da=new Date(`${a.date||''}T${a.time||'00:00'}`),db=new Date(`${b.date||''}T${b.time||'00:00'}`);return da-db});let cumulative=0;for(const x of ordered){cumulative+=profit(x);if(x.id===id)break;}const date=fmtDate(b.date,b.time);tip.innerHTML=`<div class="graphTipHead"><b>${date}</b><span class="graphTipProfit ${pft>=0?'pos':'neg'}">${pft>=0?'+':''}${money(pft)}</span></div><div class="graphTipMeta">${b.home&&b.away?`${b.home} v ${b.away}`:(b.event||'Bet')} · ${b.market||'Market'} · <strong>${b.selection||'—'}</strong><br>Stake ${money(b.stake)} · Odds ${n(b.odds).toFixed(2)} · Cumulative ${cumulative>=0?'+':''}${money(cumulative)}</div>`;tip.classList.add('show')}
function deleteBet(id){const b=state.bets.find(x=>x.id===id);if(!b)return;if(!confirm(`Delete Bet #${idNum(b)||b.id}?\n\nThis cannot be undone.`))return;if((b.home||'')==='Libertad Asuncion'&&(b.away||'')==='Sportivo San Lorenzo'&&(b.selection||'')==='Over 0.5'&&Number(b.odds)===1.61&&Number(b.stake)===5)state.seedDeleted=true;state.bets=state.bets.filter(x=>x.id!==id);save();toast('Bet deleted');renderAll()}
function editResult(id){const b=state.bets.find(x=>x.id===id);if(!b)return;const current=result(b)||'Open';const choice=prompt(`Change result for Bet #${idNum(b)||b.id}.\n\nType: Open, Win, or Loss`,current);if(choice===null)return;const v=choice.trim().toLowerCase();if(!['open','win','loss'].includes(v)){toast('Please enter Open, Win or Loss');return}settle(id,v==='open'?'':v[0].toUpperCase()+v.slice(1));toast(v==='open'?'Bet reopened':`Result changed to ${v}`)}
function show(name){state.screen=name;document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===name));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.screen===name));if(name==='dashboard')renderDashboard();if(name==='live')renderLive();if(name==='results')renderResults();if(name==='stats')renderStats();if(name==='add')renderAdd()}
function renderAll(){renderDashboard();renderLive();renderResults();renderStats();renderAdd();show(state.screen||'dashboard')}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.screen));
let deferred=null;document.getElementById('installBtn').onclick=()=>{if(deferred){deferred.prompt();deferred=null}else toast('Use your browser menu to install the app')};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
renderAll();
</script></body></html>
